# **This file said 'verified against' and named versions nothing had been
# verified against.** Cutting v7.0.0 on 2026-09-13, eleven of fifteen pins
# disagreed with what the suite actually runs on -- fastapi 0.109.0 here
# against 0.136.1 installed, starlette 0.35.1 against 1.0.0 -- and pip_audit
# found twenty advisories in five packages, all of them against versions
# this project had already moved past. A stale lock does not merely fail to
# protect: it points whoever installs from it at software nobody tested,
# with the vulnerabilities the pinning was supposed to make visible.
#
# S-2026-03 is the standing note that pinning hides advisories because
# there is no Dependabot here. The answer is the line in INSTALL.md: run
# pip_audit at every version bump, and regenerate THIS from the
# environment the gates just passed in.

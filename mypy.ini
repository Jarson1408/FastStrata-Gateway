; Type checking, introduced deliberately narrow.
;
; The codebase is ~87% annotated and has no history of being type-checked, so
; turning strict mode on everything at once would produce hundreds of findings
; and get ignored. It started on gateway/lodestar/ — the cleanest subpackage,
; pure functions with no I/O — and widens module by module.
;
;   python -m mypy --config-file mypy.ini gateway
;
; The whole package is clean at this (non-strict) level since 2026-09-04.
; gateway/lodestar/ keeps the stricter settings below; everything else is held
; only at the base level, which is what the audit's ten findings were. Widening
; the COMMAND mattered as much as fixing them: the errors lived outside the
; scope AGENTS.md documented, so nobody's mypy run ever saw them (R-2026-02).

[mypy]
python_version = 3.12
ignore_missing_imports = True
; Off deliberately: the per-module sections below cover modules that are
; not in scope yet, and mypy would report each as unused.
warn_unused_configs = False
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True

; Not yet enabled anywhere: too many dict[str, Any] boundaries to fix in one go.
disallow_untyped_defs = False
disallow_any_generics = False

[mypy-gateway.lodestar.*]
disallow_untyped_defs = True
check_untyped_defs = True

; Tests use unittest fixtures and monkeypatching that annotate poorly, and they
; pass deliberately wrong types to check the error paths — their
; `type: ignore[arg-type]` markers are documentation, not dead weight.
[mypy-gateway.tests.*]
disallow_untyped_defs = False
check_untyped_defs = False
warn_unused_ignores = False

[mypy-gateway.lodestar.tests.*]
disallow_untyped_defs = False
check_untyped_defs = False
warn_unused_ignores = False

; PySide6 ships stubs of varying quality; not the place to start.
[mypy-gateway.gui]
ignore_errors = True
